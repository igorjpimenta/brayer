name: deprecate-opencode

on:
  workflow_dispatch:

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: |
          npm deprecate @igorjpimenta/brayer-opencode@2026.10.28-beta.1 "Broken OpenCode plugin loader shape. Use 2026.10.28-beta.3 or later."
          npm deprecate @igorjpimenta/brayer-opencode@2026.10.28-beta.2 "Broken OpenCode npm entry. Use 2026.10.28-beta.3 or later."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
