name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:e2e
      - name: Package smoke
        run: |
          tmp="$RUNNER_TEMP/brayer-package"
          mkdir -p "$tmp"
          npm pack --pack-destination "$tmp"
          cd "$tmp"
          npm init -y >/dev/null
          npm install ./igorjpimenta-brayer-*.tgz >/dev/null
          ./node_modules/.bin/brayer --version
          BRAYER_DB="$tmp/store.sqlite" ./node_modules/.bin/brayer status
